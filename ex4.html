<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation and Effects</title>
    <style>
        #box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            position: relative;
            margin: 20px;
        }

        #content {
            background-color: lightgreen;
            padding: 20px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1 id="heading">Animation and Effects</h1>

    <button id="animationbtn">Animation</button>
    <button id="fadeinbtn">FadeIn</button>
    <button id="fadeoutbtn">FadeOut</button>
    <button id="sildeleft">Sildeleft</button>
    <button id="silderight">SildeRight</button>

    <div id="box">

    </div>
    <div id="content">
        This is jquery effects content!
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function(){
            $("#animationbtn").click(function(){
                $("#box").animate({
                    left: "300px",
                    height: "200px",
                    width: "200px"

                },1000);
                
            });
            $("#fadeinbtn").click(function(){
                $("#content").fadeIn();
            });
            $("#fadeoutbtn").click(function(){
                $("#content").fadeOut();
            });
            $("#sildeleft").click(function(){
                $("#content").sildeleft();
            });
            $("#silderight").click(function(){
                $("#content").silderight();
            });
        })
    </script>


</body>
</html>
